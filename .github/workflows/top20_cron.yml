name: Top 20 Strong Stocks Bot

on:
  schedule:
    # 台北時間 14:35（UTC 06:35），週一至週五
    - cron: "35 6 * * 1-5"
  workflow_dispatch:

jobs:
  run-top20-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install pandas requests yfinance

      - name: Run top20_bot.py and push to Telegram
        env:
          TZ: Asia/Taipei
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python top20_bot.py
